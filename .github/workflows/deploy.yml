name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  build_and_upload:
    name: Build and upload artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build

  deploy:
    name: Deploy on self-hosted runner
    needs: build_and_upload
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout repository (for provenance)
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build

      - name: Prepare SSH key and config
        run: |
          mkdir -p ~/.ssh
          # Write the private key, handling potential Windows line endings
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" | sed 's/\r$//' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Add host to known_hosts with fallback
          ssh-keyscan -t rsa -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || \
            ssh-keyscan -t rsa "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || \
            echo "Warning: ssh-keyscan failed; proceeding with StrictHostKeyChecking=no"
          
          # Create SSH config for this host
          cat > ~/.ssh/config << EOF
          Host target-server
            HostName ${{ secrets.SSH_HOST }}
            Port ${{ secrets.SSH_PORT }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Test SSH connection
        run: |
          ssh -v target-server "echo 'SSH connection successful'" || exit 1

      - name: Copy build to remote server
        run: |
          scp -r -P "${{ secrets.SSH_PORT }}" -i ~/.ssh/id_rsa -o ConnectTimeout=10 \
            build/* "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_TARGET_PATH }}"

      - name: Restart PM2 on remote server
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/id_rsa "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd ${{ secrets.SSH_TARGET_PATH }} && pm2 restart portal-prod || pm2 start serve --name portal-prod -- -s build -l 3000"
