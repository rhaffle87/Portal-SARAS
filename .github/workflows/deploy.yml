name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  build_and_upload:
    name: Build and upload artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build

  deploy:
    name: Deploy on self-hosted runner
    needs: build_and_upload
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout repository (for provenance)
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts || true

      - name: Copy build to remote server
        run: |
          scp -r -P "${{ secrets.SSH_PORT }}" build/* "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_TARGET_PATH }}"

      - name: Restart PM2 on remote server
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd ${SSH_TARGET_PATH:-${{ secrets.SSH_TARGET_PATH }}} && pm2 restart portal-prod || pm2 start serve --name portal-prod -- -s build -l 3000"
